name: ci-cd

on:
  # Pull requests into main run the tests only. Images are built and deployed
  # only from main (see the build-and-push and deploy job conditions).
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Extra image tag to publish to GHCR (deploys always use the commit tag)
        required: false
        default: latest
      frontend_api_base_url:
        description: Public API base URL baked into the frontend image
        required: false
        default: https://workspaceapi.incelgroup.com/api/v1

permissions:
  contents: read
  packages: write

# One run at a time per pull request or branch. A new push to a pull request
# cancels its older run. Runs on main are queued instead of cancelled, so a
# deploy that has started is never stopped halfway (API updated, frontend not).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_TAG: ${{ github.sha }}
  LATEST_TAG: ${{ inputs.image_tag || 'latest' }}
  GHCR_OWNER: ${{ github.repository_owner }}
  CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: incel_portal_db
          POSTGRES_USER: incel_portal_user
          POSTGRES_PASSWORD: incel_portal_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incel_portal_user -d incel_portal_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: incel_portal_db
      DB_USER: incel_portal_user
      DB_PASSWORD: incel_portal_password
      AWS_S3_BUCKET_NAME: ci-bucket
      AWS_S3_REGION_NAME: us-east-1
      AWS_APPLICATION_LOGO_S3_PREFIX: application-logos
      AWS_APPLICATION_LOGO_UPLOAD_URL_EXPIRES_IN: 900
      AWS_S3_OBJECT_ACL: public-read
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint API
        working-directory: api
        # Version pinned so a new ruff release cannot fail the build on its own.
        run: |
          pip install ruff==0.17.5
          ruff check .

      - name: Run Django system checks
        working-directory: api
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: api
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        working-directory: api
        run: python manage.py test

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install frontend dependencies
        working-directory: portal
        run: npm ci

      - name: Run frontend lint
        working-directory: portal
        run: npm run lint

      - name: Build frontend
        working-directory: portal
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.frontend_api_base_url || 'https://workspaceapi.incelgroup.com/api/v1' }}
        run: npm run build

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          # The seed command only runs against a database whose name ends in _e2e.
          POSTGRES_DB: incel_portal_e2e
          POSTGRES_USER: incel_portal_user
          POSTGRES_PASSWORD: incel_portal_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incel_portal_user -d incel_portal_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Read by api/portalapi/settings.py (CI has no api/.env). The test API
      # script supplies everything else and keeps email, push and storage offline.
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: incel_portal_user
      DB_PASSWORD: incel_portal_password
      DJANGO_SECRET_KEY: ci-e2e-secret-key
      # The script defaults to a local virtualenv; CI installs into the runner's Python.
      E2E_PYTHON: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install frontend dependencies
        working-directory: portal
        run: npm ci

      - name: Install Playwright browser
        working-directory: portal
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: portal
        run: npm run test:e2e

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            portal/e2e/.report
            portal/e2e/.results
          retention-days: 14
          if-no-files-found: ignore

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
      - e2e-tests
    # Never for pull requests, and manual runs only from main, so images
    # (including :latest) always come from merged code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/incel-portal-backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_OWNER }}/incel-portal-backend:${{ env.LATEST_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./portal
          file: ./portal/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.frontend_api_base_url || 'https://workspaceapi.incelgroup.com/api/v1' }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/incel-portal-frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_OWNER }}/incel-portal-frontend:${{ env.LATEST_TAG }}

  deploy-to-caprover:
    name: Deploy to CapRover
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Each app is deployed from the image tagged with this run's commit, not
    # :latest, so production always runs exactly the code that was just tested
    # and a rollback is a redeploy of an earlier commit's image.
    steps:
      - name: Deploy API
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ env.CAPROVER_SERVER }}
          app: incel-portal-api
          token: ${{ secrets.CAPROVER_TOKEN_API }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-portal-backend:${{ env.IMAGE_TAG }}

      - name: Deploy Celery Worker
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ env.CAPROVER_SERVER }}
          app: incel-portal-celery-worker
          token: ${{ secrets.CAPROVER_TOKEN_CELERY_WORKER }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-portal-backend:${{ env.IMAGE_TAG }}

      - name: Deploy Celery Beat
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ env.CAPROVER_SERVER }}
          app: incel-portal-celery-beat
          token: ${{ secrets.CAPROVER_TOKEN_CELERY_BEAT }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-portal-backend:${{ env.IMAGE_TAG }}

      - name: Deploy Frontend
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ env.CAPROVER_SERVER }}
          app: incel-portal-frontend
          token: ${{ secrets.CAPROVER_TOKEN_FRONTEND }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-portal-frontend:${{ env.IMAGE_TAG }}
