<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{% block title %}Incel Portal{% endblock %}</title>
    <style>
      body { margin: 0; padding: 0; background-color: #f1f5f9; -webkit-text-size-adjust: 100%; }
      body, td, th, p, li, a { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 32px; }
      h1 { margin: 0 0 20px; font-size: 22px; line-height: 1.3; font-weight: 700; color: #09090b; letter-spacing: -0.01em; }
      h2 { margin: 28px 0 10px; font-size: 16px; line-height: 1.4; font-weight: 700; color: #09090b; }
      p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #27272a; }
      ul { margin: 0 0 16px; padding-left: 20px; }
      li { margin: 0 0 6px; font-size: 15px; line-height: 1.6; color: #27272a; }
      a { color: #0d47a1; }
      strong { color: #09090b; }
      .details { width: 100%; border-collapse: separate; border-spacing: 0; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin: 0 0 20px; }
      .details th { width: 128px; padding: 10px 0 10px 16px; text-align: left; vertical-align: top; font-size: 13px; line-height: 1.5; font-weight: 600; color: #52525b; }
      .details td { padding: 10px 16px; vertical-align: top; font-size: 15px; line-height: 1.5; color: #09090b; }
      .details tr + tr th, .details tr + tr td { border-top: 1px solid #e2e8f0; }
      .text { white-space: pre-wrap; word-wrap: break-word; }
      .note { border-radius: 8px; padding: 14px 16px; margin: 0 0 20px; border: 1px solid #e2e8f0; background-color: #f8fafc; }
      .note p { margin: 0 0 6px; font-size: 14px; }
      .note p:last-child { margin-bottom: 0; }
      .note-warning { background-color: #fffbeb; border-color: #fde68a; }
      .note-warning p, .note-warning strong { color: #78350f; }
      .note-danger { background-color: #fef2f2; border-color: #fecaca; }
      .note-danger p, .note-danger strong { color: #7f1d1d; }
      .note-success { background-color: #f0fdf4; border-color: #bbf7d0; }
      .note-success p, .note-success strong { color: #14532d; }
      .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 13px; line-height: 1.6; font-weight: 600; background-color: #f1f5f9; color: #3f3f46; }
      .pill-high { background-color: #fef2f2; color: #991b1b; }
      .pill-medium { background-color: #fffbeb; color: #92400e; }
      .pill-low { background-color: #f0fdf4; color: #166534; }
      .button-cell { border-radius: 8px; background-color: #0d47a1; }
      .button { display: inline-block; padding: 12px 24px; border-radius: 8px; background-color: #0d47a1; color: #ffffff !important; font-size: 15px; line-height: 1.2; font-weight: 600; text-decoration: none; }
      .fallback { font-size: 13px; line-height: 1.6; color: #52525b; }
      .fallback a { word-break: break-all; }
      .muted { color: #52525b; }
      .metrics { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid #e2e8f0; border-radius: 8px; margin: 0 0 20px; }
      .metrics th { padding: 10px 16px; font-size: 13px; line-height: 1.4; font-weight: 600; color: #52525b; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; text-align: right; }
      .metrics th:first-child { text-align: left; border-radius: 8px 0 0 0; }
      .metrics th:last-child { border-radius: 0 8px 0 0; }
      .metrics td { padding: 12px 16px; font-size: 15px; line-height: 1.4; color: #27272a; text-align: right; white-space: nowrap; }
      .metrics td:first-child { text-align: left; white-space: normal; }
      .metrics tr + tr td { border-top: 1px solid #e2e8f0; }
      .metrics .value { font-weight: 700; color: #09090b; }
      .metrics .change { font-size: 14px; }
      .metrics .sub { display: block; font-size: 13px; color: #52525b; }
      .footer p { margin: 0 0 6px; font-size: 12px; line-height: 1.6; color: #52525b; }
      @media only screen and (max-width: 480px) {
        .card { padding: 24px 20px !important; }
        .details th { display: block; width: auto !important; padding: 10px 16px 0 !important; }
        .details td { display: block; padding: 2px 16px 10px !important; }
        .details tr + tr td { border-top: 0 !important; }
        .metrics th, .metrics td { padding-left: 10px !important; padding-right: 10px !important; }
      }
    </style>
  </head>
  <body>
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">{% block preheader %}{% endblock %}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f1f5f9">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px">
            <tr>
              <td style="padding: 0 4px 14px; font-size: 15px; font-weight: 700; color: #0d47a1; letter-spacing: -0.01em">Incel Portal</td>
            </tr>
            <tr>
              <td class="card">
                <h1>{% block heading %}{% endblock %}</h1>
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td class="footer" style="padding: 18px 4px 0">
                {% block footer %}<p>This is an automated message from Incel Portal. Replies to this address are not read.</p>{% endblock %}
                <p>&copy; {% now "Y" %} Incel Group</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
