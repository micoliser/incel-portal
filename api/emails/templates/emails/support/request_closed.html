<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #333; line-height: 1.6; }
      .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; }
      .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
      .header h1 { color: #2c3e50; margin: 0; font-size: 24px; }
      .content { padding: 20px 0; }
      .details { background-color: #f9f9f9; border-left: 4px solid #6b7280; padding: 15px; margin: 15px 0; border-radius: 4px; }
      .details p { margin: 8px 0; }
      .label { font-weight: bold; color: #2c3e50; }
      .footer { border-top: 2px solid #f0f0f0; padding-top: 20px; text-align: center; font-size: 12px; color: #999; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Support Request Closed</h1>
      </div>
      <div class="content">
        <p>Hello <strong>{{ recipient_name }}</strong>,</p>
        <p>The following support request has been closed.</p>
        <div class="details">
          <p><span class="label">Title:</span> {{ title }}</p>
          <p><span class="label">Category:</span> {{ category }}</p>
          <p><span class="label">Status:</span> {{ status }}</p>
          <p><span class="label">Department:</span> {{ department_name }}</p>
        </div>
        <div style="text-align: center;">
          <a href="{{ link_url }}" class="cta-button">View Request</a>
        </div>
      </div>
      <div class="footer">
        <p>This is an automated notification from Incel Group Workspace.</p>
      </div>
    </div>
  </body>
</html>
